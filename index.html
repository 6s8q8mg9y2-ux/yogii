<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sleep Checker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <h1>Sleep Checker 😴</h1>

    <div class="card">
      <label>Umur</label>
      <input type="number" id="umur" placeholder="Masukkan umur">

      <label>Jam Tidur (0 - 23)</label>
      <input type="number" id="jamTidur" min="0" max="23" placeholder="Contoh: 23">

      <label>Jam Bangun (0 - 23)</label>
      <input type="number" id="jamBangun" min="0" max="23" placeholder="Contoh: 7">

      <button onclick="cekTidur()">
        Check Sleep
      </button>

      <div id="hasil"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
